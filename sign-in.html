<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap"rel="stylesheet"/>
    <link rel="stylesheet" href="css/all.min.css"/>
    <link rel="stylesheet" href="css/Final_Project.css"/>
    <link rel="stylesheet" href="css/Final_Project_Responsive.css"/>
  </head>

  <body class="bg-white">
    <div class="container p-4 sign-in-container">
      <div class="row sign-in-row">

        <!-- image-side -->
        <div class="col-6 image-side">
          <div class="image-card">
            <img src="assets/WhatsApp Image 2026-11-13 at 7.18.24 PM.jpeg" alt="sign-in-image" class="sign-in-image">
          </div>
        </div>

        <!-- form-side -->
        <div class="col-6 d-flex align-items-center ps-12 form-side">
          <div class="p-3 w-75 mx-auto">
            <h1 class="mb-5 fw-semibold form-title fg-black">Sign In</h1>
            <p class="mb-8 small fg-4">Don't have an account? <a href="myaccount.html" class="text-decoration-none fg-emphasis-success fw-medium sign-up-link">Sign Up</a></p>
            <div id="message" class="alert theme-success d-none">Signed in successfully!</div>

            <form id="sign-in-form">
              <!-- username or email label -->
              <div class="mb-6">
                <input type="text" class="form-control form-input fg-black" id="email" placeholder="Your username or Email" required>
                <div class="invalid-feedback">Please enter a valid username or email.</div>
              </div>
              <!-- password label -->
              <div class="mb-6 position-relative">
                <input type="password" class="form-control form-input pe-5 fg-black" id="password" placeholder="Password" required>
                <button type="button" class="btn btn-link position-absolute top-50 end-0 translate-middle-y me-3 text-decoration-none fg-4" id="password-icon"><i class="fas fa-eye"></i></button>
                <div class="invalid-feedback">Please enter a valid password.</div>
              </div>

              <div class="d-flex justify-content-between align-content-center mb-4">
                <!-- remember me -->
                <div class="form-checkbox mb-0">
                  <input type="checkbox" class="checkSizeSm" id="rememberMe">
                  <label class="fs-sm fg-4" for="rememberMe">Remember Me</label>
                </div>
                <!-- forgot password -->
                <a href="" class="text-decoration-none small fg-black fw-medium">Forgot Password?</a>
              </div>
              <button type="submit" class="btn sign-in-btn w-100 mb-4 mt-4">Sign In</button>
            </form>

          </div>
        </div>

      </div>
    </div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="js/Final_Project.js"></script>
  </body>
</html>
